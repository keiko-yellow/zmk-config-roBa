CONFIG_ZMK_KEYBOARD_NAME="roBa"
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
# 小さい移動を0に潰さない
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y

# 数字レイヤーのスクロールを効きやすくする（16 -> 8）
CONFIG_PMW3610_SCROLL_TICK=8
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n

CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_FORCE_AWAKE=n

CONFIG_PMW3610_POLLING_RATE_125=y
# 改善効果があったため維持
CONFIG_PMW3610_SMART_ALGORITHM=n

CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

CONFIG_ROBA_AUTOMOUSE_TYPING_GUARD_MS=200

# 右側には有効なEC11がないため、
# CONFIG_EC11 / CONFIG_EC11_TRIGGER_GLOBAL_THREAD は設定しない。
# これによりDT_HAS_ALPS_EC11_ENABLED=nのKconfig警告を回避する。
# keymap-sensors自体は共通keymapのsensor-bindingsのため維持。
CONFIG_ZMK_KEYMAP_SENSORS=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
